<div class="col-md-6 mb-3">
    <div class="form-check mt-4">
        <input type="hidden" name="{{field}}" value="0">
        <input class="form-check-input" type="checkbox" name="{{field}}" value="1" id="check_{{field}}" {{checked}} {{required}} {{disabled}}>
        <label class="form-check-label small fw-bold text-secondary" for="check_{{field}}">
            {{label}}
        </label>
    </div>
</div>
